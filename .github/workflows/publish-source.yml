name: Install prepared LDH source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract reviewed source bundle and publish files
        shell: bash
        run: |
          set -euo pipefail
          test -f LDH_source.zip
          unzip -q LDH_source.zip -d .
          rm LDH_source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish reviewed LDH source code"
          git push
